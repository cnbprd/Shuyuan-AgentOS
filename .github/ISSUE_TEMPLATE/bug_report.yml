name: Bug report
description: 报告可复现的缺陷，附环境、步骤与日志。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请先搜索已有 Issue；安全漏洞不要走这里，见 SECURITY.md。
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、WSL 发行版、源码 commit、编译产品、QEMU 版本等。
      placeholder: "Windows 11 / WSL Ubuntu 22.04 / commit fa4d6bf / qemu-loongarch64-linux-min"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出命令与操作。
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附完整报错或关键日志；请先脱敏。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与排查
      description: 相关文件、行号、上游依据链接、已排除的可能。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，未发现重复。
          required: true
        - label: 日志已脱敏，不含密钥、个人信息或内网地址。
          required: true
        - label: 这不是安全漏洞；安全漏洞按 SECURITY.md 私下报告。
          required: true
