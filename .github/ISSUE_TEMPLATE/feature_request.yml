name: Feature request
description: 提出有边界的改进建议，说明动机、方案与影响。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        本项目优先保证“可靠地组织智能”的底座边界；请说明需求与现有架构的关系。
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 解决什么问题，当前做法为什么不够。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 接口、SA 归属、配置或文档层面的改动。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 涉及哪些层、是否需要改 SA ID / SELinux / 产品登记。
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 与文档，未发现重复。
          required: true
        - label: 愿意按 CONTRIBUTING.md 提交 PR（可选）。
